name: API Tests CI

on:
  push:
    branches:
      - main
      - ft/frontend-setup
      - ft/yml
      - ft/product-api-tests
      - ft/category-Api-tests
      - ft/user-Api-test

  pull_request:
    branches:
      - main
      - ft/frontend-setup

  workflow_dispatch:

jobs:
  api-tests:
    name: Run REST Assured API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run Authentication API tests
        run: mvn test -Dtest=Auth*ApiTest

      - name: Run Category API tests
        run: mvn test -Dtest=CategoryApiTest

      - name: Run User API tests
        run: mvn test -Dtest=UserApiTest

      - name: Run Product API tests
        run: mvn test -Dtest=ProductApiTest

      - name: Upload Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: target/surefire-reports
